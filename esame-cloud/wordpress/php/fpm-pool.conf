; PHP-FPM pool, loaded after the image defaults (listen = 9000).
; ${PHP_FPM_MAX_CHILDREN} comes from the environment: sized per site.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; health check (used by Docker and by the updater through cgi-fcgi)
ping.path = /ping
ping.response = pong
