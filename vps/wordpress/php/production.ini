; Production settings, loaded after the defaults of the official image.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 32M
post_max_size = 32M

allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Code changes only through the updater: check timestamps once a minute.
; Sized for big themes and many plugins (Divi + 40 plugins ~ 15000 files).
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; fewer stat() calls on every include
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; a slow or unreachable external service must not hold a PHP worker for a minute
default_socket_timeout = 15
