# One stack per site, behind the shared edge proxy. Run through ./site.sh <site> ...
# Each site lives in sites/<site>/ (html, import, secrets, .env); see new-site.sh.
# Images come from the registry (images.env, written by build.sh), pinned by digest.
name: ${SITE_NAME:?set SITE_NAME in the site .env}

# Public resolvers for the containers that go out to the Internet: Docker's DNS still
# resolves the service names (db, redis) and forwards the others here, so it works
# whatever the resolver of the host is.
x-dns: &dns
  - ${CONTAINER_DNS_1:-1.1.1.1}
  - ${CONTAINER_DNS_2:-9.9.9.9}

# Every container says which site it belongs to:
#   docker ps --filter label=wp.domain=esempio.it
#   docker ps --format 'table {{.Label "wp.domain"}}\t{{.Names}}\t{{.Status}}'
x-site-labels: &site-labels
  wp.site: ${SITE_NAME}
  wp.domain: ${SITE_DOMAIN}

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
  WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
  WP_HOME: ${SITE_URL:-https://${SITE_DOMAIN}}
  # Redis object cache (Redis Object Cache plugin); updates only through the updater
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_REDIS_HOST', 'redis');
    define('WP_REDIS_PORT', 6379);
    define('WP_REDIS_PASSWORD', trim(file_get_contents('/run/secrets/redis_password')));
    define('WP_REDIS_PREFIX', '${DB_NAME}:');
    define('DISALLOW_FILE_EDIT', true);
    define('AUTOMATIC_UPDATER_DISABLED', true);
    // wp-cron runs every 5 minutes from the wp-cron timer (jobs.sh), not during visits
    define('DISABLE_WP_CRON', true);

services:
  nginx:
    image: ${NGINX_IMAGE_REF:?run build.sh and pass images.env}
    container_name: ${SITE_NAME}-nginx
    hostname: ${SITE_NAME}-nginx
    labels:
      <<: *site-labels
      wp.service: nginx
    # no "ports": reached only by the edge proxy on the <site>_edge network
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      NGINX_CACHE_MAX_SIZE: ${NGINX_CACHE_MAX_SIZE:-512m}
      NGINX_CACHE_PAGE_TTL: ${NGINX_CACHE_PAGE_TTL:-10m}
      NGINX_CACHE_STATIC_TTL: ${NGINX_CACHE_STATIC_TTL:-7d}
      NGINX_RATE_PAGES: ${NGINX_RATE_PAGES:-10r/s}
      NGINX_RATE_API: ${NGINX_RATE_API:-5r/s}
      NGINX_RATE_LOGIN: ${NGINX_RATE_LOGIN:-5r/m}
      NGINX_CONN_PER_IP: ${NGINX_CONN_PER_IP:-20}
    volumes:
      - nginx_cache:/var/cache/nginx
      - ./sites/${SITE_NAME}/html:/var/www/html:ro   # static files served directly by nginx
    tmpfs:
      - /etc/nginx/conf.d   # rendered templates
      - /run
      - /tmp
    read_only: true
    # master binds 443 as root, workers switch to the nginx user
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        aliases:
          - ${SITE_NAME}-web   # unique name for the edge, which joins every site network
      web: {}
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPUS:-0.50}"
          memory: ${NGINX_MEMORY:-128M}

  wordpress:
    image: ${WORDPRESS_IMAGE_REF:?run build.sh and pass images.env}
    container_name: ${SITE_NAME}-wordpress
    hostname: ${SITE_NAME}-wordpress
    labels:
      <<: *site-labels
      wp.service: wordpress
    environment:
      <<: *wordpress-env
      # first start only (see wordpress/bin/wp-bootstrap)
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-5}
      WP_TITLE: ${WP_TITLE:-WordPress}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
    secrets:
      - db_password
      - redis_password
      - wp_admin_password
    volumes:
      - ./sites/${SITE_NAME}/html:/var/www/html
      # existing site to import on the first start: files/wp-content/ and db.sql[.gz]
      - ./sites/${SITE_NAME}/import:/import:ro
    networks:
      - web
      - data
      - egress       # plugins calling external services (APIs, maps, reviews, licences)
    dns: *dns
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ready only after the first-start setup, and PHP-FPM answering its ping.
      # Each ping starts a worker (pm = ondemand): a long interval lets an idle site stay empty.
      test: ["CMD-SHELL", "test -f /var/www/html/.wp-bootstrap-done && SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 60s
      start_interval: 5s
      timeout: 5s
      start_period: 300s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${WORDPRESS_CPUS:-1.00}"
          memory: ${WORDPRESS_MEMORY:-256M}

  # Updates of core, plugins and themes with checks and automatic rollback
  # (see wordpress/bin/wp-update). Not a running service: a one-off job started by
  # the wp-update timer (jobs.sh update) or by hand with ./site.sh <site> run --rm updater
  updater:
    image: ${WORDPRESS_IMAGE_REF:?run build.sh and pass images.env}
    profiles: ["jobs"]
    hostname: ${SITE_NAME}-updater
    labels:
      <<: *site-labels
      wp.service: updater
    command: ["wp-update"]
    environment:
      <<: *wordpress-env
      WP_BACKUP_KEEP: ${WP_BACKUP_KEEP:-7}
      WORDFENCE_API_KEY_FILE: /run/secrets/wordfence_api_key
      UPDATE_WEBHOOK_URL_FILE: /run/secrets/update_webhook_url
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    secrets:
      - db_password
      - redis_password
      - wordfence_api_key
      - update_webhook_url
    volumes:
      - ./sites/${SITE_NAME}/html:/var/www/html
      - wp_backups:/backups
    tmpfs:
      - /tmp
    read_only: true
    # runs wp-cli as root to keep file ownership consistent: only the file capabilities it needs
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    networks:
      - web          # smoke test against PHP-FPM after the updates
      - data
      - egress       # wordpress.org, Wordfence feed, webhook
    dns: *dns
    depends_on:
      wordpress:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${UPDATER_CPUS:-1.00}"
          memory: ${UPDATER_MEMORY:-768M}

  db:
    image: ${MARIADB_IMAGE}
    container_name: ${SITE_NAME}-db
    hostname: ${SITE_NAME}-db
    labels:
      <<: *site-labels
      wp.service: db
    # no "ports": reachable only from the services on the "data" network
    user: mysql
    command: ["mariadbd", "--innodb-buffer-pool-size=${DB_BUFFER_POOL:-64M}"]
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/my.cnf.d/zz-security.cnf:ro
    tmpfs:
      - /tmp
      - /run/mariadb       # UBI image: socket directory
      - /var/lib/mysql-files
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-0.50}"
          memory: ${DB_MEMORY:-384M}

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${SITE_NAME}-redis
    hostname: ${SITE_NAME}-redis
    labels:
      <<: *site-labels
      wp.service: redis
    user: redis
    command:
      - sh
      - -c
      - >-
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/auth.conf
        && exec redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-32mb}
    secrets:
      - redis_password
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs:
      - /tmp
      - /data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.25}"
          memory: ${REDIS_MEMORY:-48M}

networks:
  edge:              # .0/26, created by site.sh / edge.sh (lib.sh), shared only with the edge proxy
    name: ${SITE_NAME}_edge
    external: true
  web:               # nginx <-> PHP-FPM
    internal: true
    ipam:
      config:
        - subnet: ${NET_PREFIX:-10.200}.${SITE_NET:?set SITE_NET in the site .env}.64/26
  data:              # PHP-FPM and updater <-> MariaDB, Redis
    internal: true
    ipam:
      config:
        - subnet: ${NET_PREFIX:-10.200}.${SITE_NET}.128/26
  egress:            # Internet access for wordpress and the updater
    ipam:
      config:
        - subnet: ${NET_PREFIX:-10.200}.${SITE_NET}.192/26

volumes:
  db_data:
  wp_backups:
  nginx_cache:

secrets:
  db_password:
    file: ./sites/${SITE_NAME}/secrets/db_password
  db_root_password:
    file: ./sites/${SITE_NAME}/secrets/db_root_password
  redis_password:
    file: ./sites/${SITE_NAME}/secrets/redis_password
  wp_admin_password:
    file: ./sites/${SITE_NAME}/secrets/wp_admin_password
  wordfence_api_key:
    file: ./sites/${SITE_NAME}/secrets/wordfence_api_key
  update_webhook_url:
    file: ./sites/${SITE_NAME}/secrets/update_webhook_url
