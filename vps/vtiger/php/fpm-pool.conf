; PHP-FPM pool, loaded after the image defaults (listen = 9000).
; ${PHP_FPM_MAX_CHILDREN} comes from the environment: sized per site.
[www]
; workers only while the CRM is used: an idle site keeps no PHP process
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 10s
pm.max_requests = 500

; long reports and imports (max_execution_time = 600)
request_terminate_timeout = 620s

; health check (used by Docker through cgi-fcgi)
ping.path = /ping
ping.response = pong
