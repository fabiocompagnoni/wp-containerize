; vtiger settings, loaded after the defaults of the official image.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT

; vtiger requirements: long reports and imports, many form fields, output buffering
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 10000
output_buffering = On
short_open_tag = Off
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC

allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; code changes only with vtiger patches: check timestamps once a minute
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; mail servers (IMAP of the mail converter) can be slow, but not forever
default_socket_timeout = 30
