# Edge proxy shared by all sites. Do not run directly: use ../edge.sh, which generates
# sites.yaml (one <site>_edge network and certificate per site) and conf.d/ (vhosts).
name: edge

services:
  edge:
    image: ${EDGE_IMAGE_REF:?run build.sh and pass images.env}
    container_name: edge
    hostname: edge
    labels:
      wp.service: edge
    ports:
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./conf.d:/etc/nginx/sites:ro
      # Cloudflare Authenticated Origin Pulls CA (the same for every zone)
      - ./origin-pull-ca.pem:/etc/nginx/certs/origin-pull-ca.pem:ro
    tmpfs:
      - /var/cache/nginx   # proxy temp files
      - /run
      - /tmp
    read_only: true
    # master binds 443 as root, workers switch to the nginx user
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${EDGE_CPUS:-1.00}"
          memory: ${EDGE_MEMORY:-256M}
