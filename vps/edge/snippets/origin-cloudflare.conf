# Production: the site is reachable only through Cloudflare (SSL/TLS mode Full (strict)).
include /etc/nginx/snippets/tls-common.conf;

# Authenticated Origin Pulls: Cloudflare presents a client certificate,
# any other client is refused during the TLS handshake.
ssl_client_certificate /etc/nginx/certs/origin-pull-ca.pem;
ssl_verify_client on;

# and the TCP connection must come from a Cloudflare address
if ($from_cloudflare = 0) { return 444; }
