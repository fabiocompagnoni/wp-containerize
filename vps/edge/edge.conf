# Edge proxy: the only container with a published port. Terminates TLS for every site
# (Cloudflare Full strict) and forwards to the site nginx on the internal network
# <site>_edge. Rate limits, WordPress rules and page cache stay in the site nginx.

server_tokens off;
client_max_body_size 32m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Real client IP: trusted only when the connection comes from Cloudflare
include /etc/nginx/cloudflare/realip.conf;
real_ip_header CF-Connecting-IP;

# 1 when the TCP peer (before realip) is a Cloudflare address
geo $realip_remote_addr $from_cloudflare {
    default 0;
    include /etc/nginx/cloudflare/geo.conf;
}

# Docker DNS, re-resolved at runtime: a stopped site gives 502 to its own
# visitors instead of stopping the edge for everyone
resolver 127.0.0.11 valid=10s ipv6=off;

# Health check for Docker, reachable only from inside the container
server {
    listen 127.0.0.1:8080;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}

# Unknown host name: drop during the TLS handshake
server {
    listen 443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
}

include /etc/nginx/sites/*.conf;
