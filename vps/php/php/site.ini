; PHP settings for the sites of the php type (PrestaShop and hand-written sites).
; The sizes are set per site in its .env (passed by php/compose.yaml); the values after ":-"
; are the defaults (syntax of PHP 8.3 and later).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = ${PHP_MEMORY_LIMIT:-384M}
max_execution_time = ${PHP_MAX_EXECUTION_TIME:-300}
max_input_time = ${PHP_MAX_EXECUTION_TIME:-300}
max_input_vars = 20000
upload_max_filesize = ${PHP_UPLOAD_MAX:-64M}
post_max_size = ${PHP_UPLOAD_MAX:-64M}

; remote URLs are read by modules and by reCAPTCHA checks (file_get_contents)
allow_url_fopen = On
allow_url_include = Off

; no SameSite: payment gateways come back with a cross-site POST
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; PrestaShop has tens of thousands of PHP files (core, vendor, modules); short revalidation,
; because modules are installed and caches cleared from the back office
opcache.enable = 1
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY:-256}
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 60000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096k
realpath_cache_ttl = 600
default_socket_timeout = 30
