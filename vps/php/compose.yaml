# PHP site (PrestaShop or hand-written PHP) served by Apache, behind the shared edge proxy.
# Run through ./site.sh <site> ... (SITE_TYPE=php in sites/<site>/.env): paths are relative
# to the vps/ directory. Same layout as the other types: fixed networks, labels, secrets, backups.
name: ${SITE_NAME:?set SITE_NAME in the site .env}

x-site-labels: &site-labels
  wp.site: ${SITE_NAME}
  wp.domain: ${SITE_DOMAIN}
  wp.type: php

x-dns: &dns
  - ${CONTAINER_DNS_1:-1.1.1.1}
  - ${CONTAINER_DNS_2:-9.9.9.9}

services:
  web:
    image: ${WEB_IMAGE_REF:?run build.sh and pass images.env}
    container_name: ${SITE_NAME}-web
    hostname: ${SITE_NAME}-web
    labels:
      <<: *site-labels
      wp.service: web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      # sizes of the site, all from its .env (see site.env.example)
      APACHE_MAX_WORKERS: ${APACHE_MAX_WORKERS:-5}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-384M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      PHP_UPLOAD_MAX: ${PHP_UPLOAD_MAX:-64M}
      PHP_OPCACHE_MEMORY: ${PHP_OPCACHE_MEMORY:-256}
    secrets:
      - db_password
    volumes:
      - ./sites/${SITE_NAME}/html:/var/www/html
      # site to import on the first start: db.sql[.gz]
      - ./sites/${SITE_NAME}/import:/import:ro
    # not read-only: Apache and PHP write their run files, sessions and temporary uploads.
    # The first start changes the owner of the files (chown) and writes its marker.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # port 80, the one the edge calls
      - SETUID             # Apache workers run as www-data
      - SETGID
      - CHOWN              # first start: files to www-data
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        aliases:
          - ${SITE_NAME}-web   # unique name for the edge, which joins every site network
      data: {}
      egress: {}               # payment gateways, module APIs, reCAPTCHA, SMTP
    dns: *dns
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # ready only after the first-start setup, and Apache + PHP answering locally.
      # Long start_period: the first start of a large shop imports its dump (tens of minutes).
      test: ["CMD-SHELL", "test -f /var/www/html/.php-bootstrap-done && curl -fsS http://127.0.0.1:8081/health.php | grep -q ok"]
      interval: 60s
      start_interval: 5s
      timeout: 5s
      start_period: 3600s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-1.00}"
          memory: ${WEB_MEMORY:-512M}

  db:
    image: ${MARIADB_IMAGE}
    container_name: ${SITE_NAME}-db
    hostname: ${SITE_NAME}-db
    labels:
      <<: *site-labels
      wp.service: db
    # no "ports": reachable only from the services on the "data" network
    user: mysql
    command: ["mariadbd", "--innodb-buffer-pool-size=${DB_BUFFER_POOL:-128M}"]
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./php/mariadb/my.cnf:/etc/my.cnf.d/zz-php.cnf:ro
    tmpfs:
      - /tmp
      - /run/mariadb       # UBI image: socket directory
      - /var/lib/mysql-files
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-0.50}"
          memory: ${DB_MEMORY:-256M}

networks:
  edge:              # .0/26, created by site.sh / edge.sh (lib.sh), shared only with the edge proxy
    name: ${SITE_NAME}_edge
    external: true
  data:              # Apache/PHP <-> MariaDB
    internal: true
    ipam:
      config:
        - subnet: ${NET_PREFIX:-10.200}.${SITE_NET:?set SITE_NET in the site .env}.128/26
  egress:            # Internet access for the site
    ipam:
      config:
        - subnet: ${NET_PREFIX:-10.200}.${SITE_NET}.192/26

volumes:
  db_data:

secrets:
  db_password:
    file: ./sites/${SITE_NAME}/secrets/db_password
  db_root_password:
    file: ./sites/${SITE_NAME}/secrets/db_root_password
