# Applied to every site of the image, before the .htaccess files of the application.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# hidden files (.env, .htaccess, .user.ini, ...) and version control folders: never served
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg)(/|$)">
    Require all denied
</DirectoryMatch>

# dumps, backups, logs, scripts and configuration left in the document root
<FilesMatch "\.(sql|sql\.gz|bak|old|orig|swp|log|sh|ini|dist)$">
    Require all denied
</FilesMatch>

# same headers as the nginx of the WordPress sites (nginx/snippets/security-headers.conf), no HSTS:
# it is set per zone on Cloudflare
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always unset X-Powered-By
