# Redis as object cache for WordPress
port 6379
protected-mode yes

# no persistence: the cache is rebuilt by WordPress after a restart
save ""
appendonly no

maxmemory-policy allkeys-lru

# commands WordPress never needs
rename-command CONFIG ""
rename-command DEBUG ""
rename-command MODULE ""

# password, written at startup from the Docker secret (see docker-compose.yml)
include /tmp/auth.conf
