# Requests that a WordPress site never needs to serve

# hidden files (.git, .env, .htaccess, .wp-bootstrap-done, ...)
location ~ /\. { return 404; }

# configuration, backups, dumps, logs (archives only in the docroot: in uploads they are legit downloads)
location ~* (?:wp-config\.php|\.(?:sql|bak|old|orig|swp|log|ini|sh))$ { return 404; }
location ~* ^/[^/]+\.(?:zip|tar|gz|tgz|7z|rar)$ { return 404; }

# version disclosure and installer
location ~* ^/(?:readme\.html|license\.txt|wp-admin/install\.php|wp-admin/setup-config\.php)$ { return 404; }

# XML-RPC: brute force and pingback amplification
location = /xmlrpc.php { return 403; }

# PHP must never run from uploads or other content folders
location ~* ^/wp-content/(?:uploads|upgrade|cache)/.*\.(?:php\d?|phtml|phar)$ { return 403; }

# user enumeration
if ($args ~* "(^|&)author=\d+") { return 403; }
